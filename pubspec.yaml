name: es_control
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10 #SVG para imagenes
  google_fonts: ^7.1.0  #Fuentes de google
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  get_it: ^9.2.1
  flutter_html: ^3.0.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4 #token
  flutter_dotenv: ^6.0.0
  #go_router: ^17.1.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/icons/ #iconos 
    - assets/images/ #imagenes
    - .env #archivo de variables de entorno

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
